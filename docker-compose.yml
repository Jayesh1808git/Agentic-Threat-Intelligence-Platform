services:

  postgres:
    image: postgres:16
    container_name: cyberrag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: threat_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - cyberrag_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d threat_intelligence"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  qdrant:
    image: qdrant/qdrant:latest
    container_name: cyberrag-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - cyberrag_qdrant_data:/qdrant/storage


  neo4j:
    image: neo4j:5
    container_name: cyberrag-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/password

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - cyberrag_neo4j_data:/data
      - cyberrag_neo4j_logs:/logs


  ingestion-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberrag-scheduler
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: threat_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      QDRANT_URL: http://qdrant:6333
      THREAT_SYNC_INTERVAL_HOURS: 5

    depends_on:
      postgres:
        condition: service_healthy


volumes:

  cyberrag_postgres_data:
  cyberrag_qdrant_data:
  cyberrag_neo4j_data:
  cyberrag_neo4j_logs: