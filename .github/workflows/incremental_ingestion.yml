name: Automatic Incremental Threat Intelligence Ingestion

on:
  schedule:
    # Runs every 5 hours automatically in the cloud
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  incremental-ingest:
    name: Run Incremental Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install httpx pydantic pydantic-settings sqlalchemy psycopg2-binary

      - name: Run Incremental Ingestion Sync
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=backend python backend/run_incremental_ingest.py --nvd-hours 6 --github-pages 3 --osv-records 500
